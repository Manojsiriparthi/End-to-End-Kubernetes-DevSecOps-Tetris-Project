version: 0.2

env:
  secrets-manager:
    SONAR_TOKEN: "sonarqube_token:Sonar_token"

  variables:
    AWS_REGION: "ap-south-1"
    ECR_REGISTRY: "153099270680.dkr.ecr.ap-south-1.amazonaws.com"
    ECR_REPOSITORY: "tetris/frontend"
    IMAGE_TAG: "v1.1.0"
    ENVIRONMENT: "dev"
    SONAR_HOST_URL: "http://13.232.24.76:9000"

phases:

  install:
    commands:
      - "cd 03-Application/Tetris-V1"
      - "echo '========================================='"
      - "echo 'INSTALL PHASE'"
      - "echo '========================================='"
      - "pwd"
      - "node --version"
      - "npm --version"
      - "docker --version"
      - "aws --version"
      - "echo 'Installing dependencies...'"
      - "npm ci"
      - "echo 'Installing SonarScanner...'"
      - "npm install --no-save sonar-scanner"
      - "echo 'INSTALL PHASE COMPLETED'"

  pre_build:
    commands:
      - "echo '========================================='"
      - "echo 'PRE-BUILD PHASE'"
      - "echo '========================================='"

      - "echo 'Running ESLint...'"
      - "npx eslint src --ext .js,.jsx"
      - "echo 'ESLint PASSED'"

      - "echo 'Logging into Amazon ECR...'"
      - "aws ecr get-login-password --region \"$AWS_REGION\" | docker login --username AWS --password-stdin \"$ECR_REGISTRY\""
      - "echo 'ECR LOGIN PASSED'"

      - "echo 'Building Docker image...'"
      - "docker build --platform linux/amd64 -t \"$ECR_REPOSITORY:$IMAGE_TAG\" ."
      - "echo 'DOCKER BUILD PASSED'"

      - "echo 'PRE-BUILD PHASE COMPLETED'"

  build:
    commands:
      - "echo '========================================='"
      - "echo 'BUILD / TEST PHASE'"
      - "echo '========================================='"

      - "echo 'Running Jest unit tests with coverage...'"
      - "CI=true npm test -- --watchAll=false --coverage"
      - "echo 'JEST TESTS PASSED'"

      - "echo '========================================='"
      - "echo 'SONARQUBE ANALYSIS'"
      - "echo '========================================='"

      - "./node_modules/.bin/sonar-scanner -Dsonar.projectKey=Tetris -Dsonar.sources=src -Dsonar.host.url=\"$SONAR_HOST_URL\" -Dsonar.token=\"$SONAR_TOKEN\""

      - "echo 'SONARQUBE ANALYSIS COMPLETED'"
      - "echo 'BUILD PHASE COMPLETED'"

  post_build:
    commands:

      - "echo '========================================='"
      - "echo 'POST-BUILD PHASE'"
      - "echo '========================================='"

      - "echo 'Tagging version image...'"
      - "docker tag \"$ECR_REPOSITORY:$IMAGE_TAG\" \"$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\""

      - "echo 'Pushing version image to ECR...'"
      - "docker push \"$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\""

      - "echo 'VERSION IMAGE PUSHED SUCCESSFULLY'"

      - "echo '========================================='"
      - "echo 'TAGGING DEVELOPMENT IMAGE'"
      - "echo '========================================='"

      - "docker tag \"$ECR_REPOSITORY:$IMAGE_TAG\" \"$ECR_REGISTRY/$ECR_REPOSITORY:dev\""

      - "docker push \"$ECR_REGISTRY/$ECR_REPOSITORY:dev\""

      - "echo 'DEV IMAGE TAG PUSHED SUCCESSFULLY'"

      - "echo '========================================='"
      - "echo 'ECR VULNERABILITY SCAN'"
      - "echo '========================================='"

      - "echo 'Waiting for ECR vulnerability scan to complete...'"

      - |
        for i in {1..30}; do
          STATUS=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageScanStatus.status' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          echo "ECR scan status: $STATUS"

          if [ "$STATUS" = "COMPLETE" ]; then
            break
          fi

          if [ "$STATUS" = "FAILED" ]; then
            echo "ECR vulnerability scan FAILED"
            exit 1
          fi

          sleep 10
        done

        if [ "$STATUS" != "COMPLETE" ]; then
          echo "ECR vulnerability scan timed out"
          exit 1
        fi

      - "echo 'ECR vulnerability scan completed.'"

      - "echo 'Checking CRITICAL vulnerabilities...'"

      - |
        CRITICAL=$(aws ecr describe-image-scan-findings \
          --repository-name "$ECR_REPOSITORY" \
          --image-id imageTag="$IMAGE_TAG" \
          --region "$AWS_REGION" \
          --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
          --output text)

        if [ "$CRITICAL" = "None" ] || [ -z "$CRITICAL" ]; then
          CRITICAL=0
        fi

        echo "CRITICAL vulnerabilities: $CRITICAL"

      - "echo 'Checking HIGH vulnerabilities...'"

      - |
        HIGH=$(aws ecr describe-image-scan-findings \
          --repository-name "$ECR_REPOSITORY" \
          --image-id imageTag="$IMAGE_TAG" \
          --region "$AWS_REGION" \
          --query 'imageScanFindings.findingSeverityCounts.HIGH' \
          --output text)

        if [ "$HIGH" = "None" ] || [ -z "$HIGH" ]; then
          HIGH=0
        fi

        echo "HIGH vulnerabilities: $HIGH"

      - "echo '========================================='"
      - "echo 'SECURITY GATE'"
      - "echo '========================================='"

      - |
        if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
          echo "SECURITY GATE FAILED"
          echo "CRITICAL vulnerabilities: $CRITICAL"
          echo "HIGH vulnerabilities: $HIGH"
          echo "Pipeline will stop."
          exit 1
        fi

        echo "SECURITY GATE PASSED"
        echo "CRITICAL vulnerabilities: $CRITICAL"
        echo "HIGH vulnerabilities: $HIGH"

      - "echo '========================================='"
      - "echo 'SECURITY PASSED - CREATING ARTIFACTS'"
      - "echo '========================================='"

      - "mkdir -p reports"
      - "echo \"$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\" > reports/image.txt"
      - "echo \"$IMAGE_TAG\" > reports/version.txt"
      - "echo \"$ENVIRONMENT\" > reports/environment.txt"
      - "echo \"CRITICAL=$CRITICAL\" > reports/security-scan.txt"
      - "echo \"HIGH=$HIGH\" >> reports/security-scan.txt"
      - "echo 'SECURITY_GATE=PASSED' >> reports/security-scan.txt"
      - "echo 'BUILD_STATUS=SUCCESS' > reports/build-status.txt"

      - "echo '========================================='"
      - "echo 'VERIFYING ECR IMAGE'"
      - "echo '========================================='"

      - "aws ecr describe-images --repository-name \"$ECR_REPOSITORY\" --image-ids imageTag=\"$IMAGE_TAG\" --region \"$AWS_REGION\""

      - "echo 'ECR IMAGE VERIFICATION PASSED'"

      - "echo '========================================='"
      - "echo 'PIPELINE BUILD SUCCESSFUL'"
      - "echo '========================================='"
      - "echo \"Application: Tetris Frontend\""
      - "echo \"Version: $IMAGE_TAG\""
      - "echo \"Environment: $ENVIRONMENT\""
      - "echo \"ECR Image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\""
      - "date"

artifacts:
  files:
    - "reports/**/*"
    - "coverage/**/*"
  base-directory: "03-Application/Tetris-V1"
  discard-paths: no

cache:
  paths:
    - "/root/.npm/**/*"
