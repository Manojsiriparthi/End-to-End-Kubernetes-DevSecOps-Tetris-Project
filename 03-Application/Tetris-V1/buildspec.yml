version: 0.2

env:
  secrets-manager:
    SONAR_TOKEN: "sonarqube_token:Sonar_token"

  variables:
    AWS_REGION: "ap-south-1"
    ECR_REGISTRY: "153099270680.dkr.ecr.ap-south-1.amazonaws.com"
    ECR_REPOSITORY: "tetris/frontend"
    IMAGE_TAG: "v1.1.0"
    SONAR_HOST_URL: "http://13.232.24.76:9000"

phases:

  install:
    commands:
      - cd 03-Application/Tetris-V1
      - echo "========================================="
      - echo "INSTALL PHASE"
      - echo "========================================="
      - echo "Current directory:"
      - pwd
      - echo "Node version:"
      - node --version
      - echo "NPM version:"
      - npm --version
      - echo "Docker version:"
      - docker --version
      - echo "AWS CLI version:"
      - aws --version
      - echo "Installing application dependencies..."
      - npm ci
      - echo "Installing SonarScanner..."
      - npm install --no-save sonar-scanner
      - echo "INSTALL PHASE COMPLETED"

  pre_build:
    commands:
      - echo "========================================="
      - echo "PRE-BUILD PHASE"
      - echo "========================================="
      - echo "Current directory:"
      - pwd
      - echo "Running ESLint..."
      - npx eslint src --ext .js,.jsx
      - echo "ESLint completed successfully."
      - echo "Logging into Amazon ECR..."
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - echo "ECR login successful."
      - echo "Building Docker image..."
      - docker build --platform linux/amd64 -t "$ECR_REPOSITORY:$IMAGE_TAG" .
      - echo "Docker image built successfully."
      - echo "PRE-BUILD PHASE COMPLETED"

  build:
    commands:
      - echo "========================================="
      - echo "BUILD PHASE"
      - echo "========================================="
      - echo "Running Jest unit tests..."
      - CI=true npm test -- --watchAll=false --coverage
      - echo "Jest unit tests completed successfully."
      - echo "========================================="
      - echo "SONARQUBE ANALYSIS"
      - echo "========================================="
      - echo "SonarQube URL: $SONAR_HOST_URL"
      - echo "Running SonarQube analysis..."
      - ./node_modules/.bin/sonar-scanner -Dsonar.projectKey=Tetris -Dsonar.sources=src -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN"
      - echo "SonarQube analysis completed successfully."
      - echo "BUILD PHASE COMPLETED"

  post_build:
    commands:
      - echo "========================================="
      - echo "POST-BUILD PHASE"
      - echo "========================================="
      - echo "Tagging Docker image..."
      - docker tag "$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
      - echo "Docker image tagged successfully."
      - echo "Pushing Docker image to Amazon ECR..."
      - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
      - echo "Docker image pushed successfully."
      - echo "Creating image information..."
      - mkdir -p reports
      - echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" > reports/image.txt
      - echo "Docker image:"
      - cat reports/image.txt
      - echo "Verifying image in Amazon ECR..."
      - aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --region "$AWS_REGION"
      - echo "ECR image verification completed."
      - echo "========================================="
      - echo "BUILD COMPLETED SUCCESSFULLY"
      - echo "========================================="
      - echo "Application: Tetris Frontend"
      - echo "Version: $IMAGE_TAG"
      - echo "ECR Image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
      - echo "Completed on:"
      - date

artifacts:
  files:
    - "reports/**/*"
  base-directory: "03-Application/Tetris-V1"
  discard-paths: no

cache:
  paths:
    - "/root/.npm/**/*"
