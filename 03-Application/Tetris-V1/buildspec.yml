version: 0.2

env:
  secrets-manager:
    SONAR_TOKEN: "sonarqube_token:Sonar_token"

  variables:
    AWS_REGION: "ap-south-1"
    ECR_REGISTRY: "153099270680.dkr.ecr.ap-south-1.amazonaws.com"
    ECR_REPOSITORY: "tetris/frontend"
    IMAGE_TAG: "v1.1.0"
    ENVIRONMENT: "dev"
    SONAR_HOST_URL: "http://13.232.24.76:9000"
    SNS_TOPIC_ARN: "arn:aws:sns:ap-south-1:153099270680:tetris-build-notifications"

phases:

  install:
    commands:
      - "cd 03-Application/Tetris-V1"
      - "echo '========================================='"
      - "echo 'INSTALL PHASE'"
      - "echo '========================================='"
      - "pwd"
      - "node --version"
      - "npm --version"
      - "docker --version"
      - "aws --version"
      - "echo 'Installing dependencies...'"
      - "npm ci"
      - "echo 'Installing SonarScanner...'"
      - "npm install --no-save sonar-scanner"
      - "echo 'INSTALL PHASE COMPLETED'"

  pre_build:
    commands:
      - "echo '========================================='"
      - "echo 'PRE-BUILD PHASE'"
      - "echo '========================================='"

      - "echo 'Running ESLint...'"
      - "npx eslint src --ext .js,.jsx"
      - "echo 'ESLint PASSED'"

      - "echo 'Logging into Amazon ECR...'"
      - "aws ecr get-login-password --region \"$AWS_REGION\" | docker login --username AWS --password-stdin \"$ECR_REGISTRY\""
      - "echo 'ECR LOGIN PASSED'"

      - "echo 'Building Docker image...'"
      - "docker build --platform linux/amd64 -t \"$ECR_REPOSITORY:$IMAGE_TAG\" ."
      - "echo 'DOCKER BUILD PASSED'"

  build:
    commands:
      - "echo '========================================='"
      - "echo 'TEST PHASE'"
      - "echo '========================================='"

      - "echo 'Running Jest unit tests with coverage...'"
      - "CI=true npm test -- --watchAll=false --coverage"
      - "echo 'JEST TESTS PASSED'"

      - "echo '========================================='"
      - "echo 'SONARQUBE ANALYSIS'"
      - "echo '========================================='"

      - "./node_modules/.bin/sonar-scanner -Dsonar.projectKey=Tetris -Dsonar.sources=src -Dsonar.host.url=\"$SONAR_HOST_URL\" -Dsonar.token=\"$SONAR_TOKEN\""

      - "echo 'SONARQUBE ANALYSIS COMPLETED'"
      - "echo 'BUILD PHASE COMPLETED'"

  post_build:
    commands:

      - "echo '========================================='"
      - "echo 'POST-BUILD PHASE'"
      - "echo '========================================='"

      - "echo 'Tagging immutable release image...'"
      - "docker tag \"$ECR_REPOSITORY:$IMAGE_TAG\" \"$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\""

      - "echo 'Pushing release image to ECR...'"
      - "docker push \"$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\""

      - "echo 'RELEASE IMAGE PUSHED'"

      - "echo '========================================='"
      - "echo 'ECR VULNERABILITY SCAN'"
      - "echo '========================================='"

      - "echo 'Waiting for ECR vulnerability scan...'"

      - |
        SCAN_STATUS=""

        for i in {1..30}; do
          SCAN_STATUS=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageScanStatus.status' \
            --output text 2>/dev/null || true)

          echo "ECR scan status: $SCAN_STATUS"

          if [ "$SCAN_STATUS" = "COMPLETE" ]; then
            break
          fi

          if [ "$SCAN_STATUS" = "FAILED" ]; then
            echo "ECR vulnerability scan FAILED"

            aws sns publish \
              --topic-arn "$SNS_TOPIC_ARN" \
              --subject "Tetris Pipeline - ECR Scan Failed" \
              --message "Tetris CodeBuild failed because the ECR vulnerability scan failed for image $IMAGE_TAG."

            exit 1
          fi

          sleep 10
        done

        if [ "$SCAN_STATUS" != "COMPLETE" ]; then
          echo "ECR vulnerability scan did not complete within the expected time."

          aws sns publish \
            --topic-arn "$SNS_TOPIC_ARN" \
            --subject "Tetris Pipeline - ECR Scan Timeout" \
            --message "Tetris CodeBuild failed because the ECR vulnerability scan timed out for image $IMAGE_TAG."

          exit 1
        fi

      - "echo 'ECR SCAN COMPLETED'"

      - "echo '========================================='"
      - "echo 'SECURITY GATE'"
      - "echo '========================================='"

      - |
        FINDINGS=$(aws ecr describe-image-scan-findings \
          --repository-name "$ECR_REPOSITORY" \
          --image-id imageTag="$IMAGE_TAG" \
          --region "$AWS_REGION" \
          --query 'imageScanFindings.findingSeverityCounts' \
          --output json)

        echo "ECR vulnerability findings:"
        echo "$FINDINGS"

        CRITICAL=$(echo "$FINDINGS" | jq -r '.CRITICAL // 0')
        HIGH=$(echo "$FINDINGS" | jq -r '.HIGH // 0')
        MEDIUM=$(echo "$FINDINGS" | jq -r '.MEDIUM // 0')
        LOW=$(echo "$FINDINGS" | jq -r '.LOW // 0')

        echo "========================================="
        echo "VULNERABILITY SUMMARY"
        echo "========================================="
        echo "CRITICAL : $CRITICAL"
        echo "HIGH     : $HIGH"
        echo "MEDIUM   : $MEDIUM"
        echo "LOW      : $LOW"
        echo "========================================="

        if [ "$CRITICAL" -gt 0 ]; then
          echo "SECURITY GATE FAILED"
          echo "CRITICAL vulnerabilities detected: $CRITICAL"
          echo "Image will NOT be promoted to DEV."

          aws sns publish \
            --topic-arn "$SNS_TOPIC_ARN" \
            --subject "Tetris Pipeline - SECURITY GATE FAILED" \
            --message "Tetris image $IMAGE_TAG failed the security gate. CRITICAL vulnerabilities: $CRITICAL. HIGH: $HIGH. Image was NOT promoted to DEV."

          exit 1
        fi

        if [ "$HIGH" -gt 0 ]; then
          echo "WARNING: HIGH vulnerabilities detected: $HIGH"
          echo "HIGH vulnerabilities are allowed by the current policy."
        else
          echo "No HIGH vulnerabilities detected."
        fi

        echo "SECURITY GATE PASSED"
        echo "CRITICAL vulnerabilities: 0"

      - "echo '========================================='"
      - "echo 'SECURITY PASSED - PROMOTING TO DEV'"
      - "echo '========================================='"

      - "docker tag \"$ECR_REPOSITORY:$IMAGE_TAG\" \"$ECR_REGISTRY/$ECR_REPOSITORY:dev\""

      - "docker push \"$ECR_REGISTRY/$ECR_REPOSITORY:dev\""

      - "echo 'DEV IMAGE PROMOTED SUCCESSFULLY'"

      - "echo '========================================='"
      - "echo 'CREATING ARTIFACTS'"
      - "echo '========================================='"

      - "mkdir -p reports"

      - "echo \"$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\" > reports/image.txt"

      - "echo \"$IMAGE_TAG\" > reports/version.txt"

      - "echo \"$ENVIRONMENT\" > reports/environment.txt"

      - "echo \"CRITICAL=$CRITICAL\" > reports/security-scan.txt"

      - "echo \"HIGH=$HIGH\" >> reports/security-scan.txt"

      - "echo \"MEDIUM=$MEDIUM\" >> reports/security-scan.txt"

      - "echo \"LOW=$LOW\" >> reports/security-scan.txt"

      - "echo 'SECURITY_GATE=PASSED' >> reports/security-scan.txt"

      - "echo 'BUILD_STATUS=SUCCESS' > reports/build-status.txt"

      - "echo '========================================='"
      - "echo 'VERIFYING ECR IMAGE'"
      - "echo '========================================='"

      - "aws ecr describe-images --repository-name \"$ECR_REPOSITORY\" --image-ids imageTag=\"$IMAGE_TAG\" --region \"$AWS_REGION\""

      - "echo 'ECR IMAGE VERIFICATION PASSED'"

      - "echo '========================================='"
      - "echo 'PIPELINE SUCCESS'"
      - "echo '========================================='"

      - "echo \"Application: Tetris Frontend\""
      - "echo \"Version: $IMAGE_TAG\""
      - "echo \"Environment: $ENVIRONMENT\""
      - "echo \"ECR Image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\""
      - "echo \"CRITICAL: $CRITICAL\""
      - "echo \"HIGH: $HIGH\""
      - "date"

      - |
        aws sns publish \
          --topic-arn "$SNS_TOPIC_ARN" \
          --subject "Tetris Pipeline - SUCCESS" \
          --message "Tetris CodeBuild succeeded. Image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG. DEV promotion completed. CRITICAL: $CRITICAL. HIGH: $HIGH."

artifacts:
  files:
    - "reports/**/*"
    - "coverage/**/*"
  base-directory: "03-Application/Tetris-V1"
  discard-paths: no

cache:
  paths:
    - "/root/.npm/**/*"
