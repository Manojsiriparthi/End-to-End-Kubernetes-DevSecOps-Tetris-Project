version: 0.2

env:
  variables:
    AWS_REGION: "ap-south-1"
    ECR_REPOSITORY: "tetris/frontend"
    IMAGE_TAG: "v1.1.0"
    ENVIRONMENT: "dev"
    SONAR_HOST_URL: "http://13.232.24.76:9000"
    SNS_TOPIC_ARN: "arn:aws:sns:ap-south-1:153099270680:tetris-build-notifications"

  secrets-manager:
    SONAR_TOKEN: "sonarqube_token:Sonar_token"

phases:

  install:
    runtime-versions:
      nodejs: 18

    commands:
      - echo "=========================================="
      - echo "INSTALL PHASE"
      - echo "=========================================="
      - node --version
      - npm --version

      - cd 03-Application/Tetris-V1

      - echo "Installing Node dependencies..."
      - npm ci

      - echo "Installing SonarScanner..."
      - npm install --no-save sonar-scanner

      - echo "Checking required tools..."
      - docker --version
      - aws --version
      - git --version

  pre_build:
    commands:
      - echo "=========================================="
      - echo "PRE-BUILD PHASE"
      - echo "=========================================="

      - echo "Current directory:"
      - pwd

      - echo "Listing application files:"
      - ls -la

      - echo "Checking AWS identity..."
      - aws sts get-caller-identity

      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "153099270680.dkr.ecr.$AWS_REGION.amazonaws.com"

      - echo "Checking ECR repository..."
      - aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION"

  build:
    commands:
      - echo "=========================================="
      - echo "BUILD PHASE"
      - echo "=========================================="

      - echo "Running ESLint..."
      - npx eslint src

      - echo "Running Jest unit tests..."
      - CI=true npx react-scripts test --watchAll=false --coverage --runInBand

      - echo "Running SonarQube analysis..."
      - ./node_modules/.bin/sonar-scanner -Dsonar.projectKey=Tetris -Dsonar.projectName="Tetris Frontend" -Dsonar.sources=src -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN" -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300

      - echo "SonarQube Quality Gate passed."

      - echo "Building Docker image..."
      - docker build --platform linux/amd64 -t "153099270680.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG" .

      - echo "Checking Docker image..."
      - docker images

      - echo "Pushing release image to ECR..."
      - docker push "153099270680.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"

      - echo "Release image pushed successfully."

  post_build:
    commands:
      - echo "=========================================="
      - echo "POST-BUILD PHASE"
      - echo "=========================================="

      - echo "Waiting for Amazon ECR vulnerability scan..."

      - |
        SCAN_READY=false

        for i in $(seq 1 30); do
          echo "ECR scan check $i/30..."

          if aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --output json > /tmp/ecr-findings.json 2>/tmp/ecr-scan-error.log; then

            echo "ECR scan findings are available."
            SCAN_READY=true
            break
          fi

          echo "ECR scan is not ready yet."

          cat /tmp/ecr-scan-error.log || true

          if grep -q "AccessDeniedException" /tmp/ecr-scan-error.log; then
            echo "ERROR: CodeBuild IAM role does not have permission to read ECR scan findings."
            exit 1
          fi

          sleep 10
        done

        if [ "$SCAN_READY" != "true" ]; then
          echo "ERROR: ECR vulnerability scan did not become available within the timeout."
          exit 1
        fi

      - echo "=========================================="
      - echo "ECR VULNERABILITY RESULTS"
      - echo "=========================================="

      - |
        CRITICAL=$(aws ecr describe-image-scan-findings \
          --repository-name "$ECR_REPOSITORY" \
          --image-id imageTag="$IMAGE_TAG" \
          --region "$AWS_REGION" \
          --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
          --output text)

        HIGH=$(aws ecr describe-image-scan-findings \
          --repository-name "$ECR_REPOSITORY" \
          --image-id imageTag="$IMAGE_TAG" \
          --region "$AWS_REGION" \
          --query 'imageScanFindings.findingSeverityCounts.HIGH' \
          --output text)

        MEDIUM=$(aws ecr describe-image-scan-findings \
          --repository-name "$ECR_REPOSITORY" \
          --image-id imageTag="$IMAGE_TAG" \
          --region "$AWS_REGION" \
          --query 'imageScanFindings.findingSeverityCounts.MEDIUM' \
          --output text)

        LOW=$(aws ecr describe-image-scan-findings \
          --repository-name "$ECR_REPOSITORY" \
          --image-id imageTag="$IMAGE_TAG" \
          --region "$AWS_REGION" \
          --query 'imageScanFindings.findingSeverityCounts.LOW' \
          --output text)

        if [ "$CRITICAL" = "None" ] || [ -z "$CRITICAL" ]; then
          CRITICAL=0
        fi

        if [ "$HIGH" = "None" ] || [ -z "$HIGH" ]; then
          HIGH=0
        fi

        if [ "$MEDIUM" = "None" ] || [ -z "$MEDIUM" ]; then
          MEDIUM=0
        fi

        if [ "$LOW" = "None" ] || [ -z "$LOW" ]; then
          LOW=0
        fi

        echo "CRITICAL vulnerabilities: $CRITICAL"
        echo "HIGH vulnerabilities:     $HIGH"
        echo "MEDIUM vulnerabilities:   $MEDIUM"
        echo "LOW vulnerabilities:      $LOW"

        echo "CRITICAL=$CRITICAL" > /tmp/ecr-security-result.txt
        echo "HIGH=$HIGH" >> /tmp/ecr-security-result.txt
        echo "MEDIUM=$MEDIUM" >> /tmp/ecr-security-result.txt
        echo "LOW=$LOW" >> /tmp/ecr-security-result.txt

        if [ "$CRITICAL" -gt 0 ]; then
          echo "=========================================="
          echo "SECURITY GATE FAILED"
          echo "CRITICAL vulnerabilities detected: $CRITICAL"
          echo "HIGH vulnerabilities are warnings only."
          echo "=========================================="

          aws sns publish \
            --topic-arn "$SNS_TOPIC_ARN" \
            --region "$AWS_REGION" \
            --subject "Tetris CI/CD - SECURITY GATE FAILED" \
            --message "Tetris build $IMAGE_TAG failed the ECR security gate. CRITICAL=$CRITICAL HIGH=$HIGH MEDIUM=$MEDIUM LOW=$LOW" \
            || true

          exit 1
        fi

        echo "=========================================="
        echo "SECURITY GATE PASSED"
        echo "CRITICAL vulnerabilities: $CRITICAL"
        echo "HIGH vulnerabilities: $HIGH (warning only)"
        echo "=========================================="

      - echo "Promoting image to DEV environment..."

      - docker tag "153099270680.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG" "153099270680.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:dev"

      - docker push "153099270680.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:dev"

      - echo "DEV image promoted successfully."

      - echo "Getting image digest..."

      - |
        IMAGE_DIGEST=$(aws ecr describe-images \
          --repository-name "$ECR_REPOSITORY" \
          --image-ids imageTag="$IMAGE_TAG" \
          --region "$AWS_REGION" \
          --query 'imageDetails[0].imageDigest' \
          --output text)

        echo "Image tag: $IMAGE_TAG"
        echo "Environment: $ENVIRONMENT"
        echo "Image digest: $IMAGE_DIGEST"

      - echo "Sending success notification..."

      - |
        aws sns publish \
          --topic-arn "$SNS_TOPIC_ARN" \
          --region "$AWS_REGION" \
          --subject "Tetris CI/CD - BUILD SUCCESS" \
          --message "Tetris build $IMAGE_TAG succeeded. Environment=dev. ECR image pushed and security gate passed. CRITICAL vulnerabilities=0. HIGH vulnerabilities are warnings only." \
          || true

      - echo "=========================================="
      - echo "PIPELINE BUILD COMPLETED"
      - echo "=========================================="

artifacts:
  files:
    - "reports/**/*"
    - "coverage/**/*"
  base-directory: "03-Application/Tetris-V1"
  discard-paths: no

cache:
  paths:
    - "03-Application/Tetris-V1/node_modules/**/*"
    - "/root/.npm/**/*"
