version: 0.2

env:
  variables:
    AWS_REGION: "ap-south-1"
    AWS_ACCOUNT_ID: "153099270680"
    ECR_REPOSITORY: "tetris/frontend"
    IMAGE_TAG: "v1.1.0"
    SONAR_HOST_URL: "http://13.232.24.76:9000"
    SNS_TOPIC_ARN: "arn:aws:sns:ap-south-1:153099270680:tetris-build-notifications"

  secrets-manager:
    SONAR_TOKEN: "sonarqube_token:Sonar_token"

phases:

  install:
    runtime-versions:
      nodejs: 18

    commands:
      - echo "===== INSTALL PHASE ====="
      - node --version
      - npm --version

      - cd 03-Application/Tetris-V1

      - echo "Installing Node dependencies..."
      - npm ci

      - echo "Installing SonarScanner..."
      - npm install --no-save sonar-scanner

      - echo "Installing Trivy..."
      - |
          TRIVY_VERSION="0.56.2"

          curl -sfL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz

          tar -xzf /tmp/trivy.tar.gz -C /tmp

          mv /tmp/trivy /usr/local/bin/trivy

          chmod +x /usr/local/bin/trivy

          trivy --version

      - echo "Checking tools..."
      - docker --version
      - aws --version
      - trivy --version


  pre_build:
    commands:
      - echo "===== PRE-BUILD PHASE ====="

      - echo "Current directory:"
      - pwd

      - echo "AWS identity:"
      - aws sts get-caller-identity

      - echo "Logging into ECR..."
      - |
          aws ecr get-login-password \
            --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin \
                "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - echo "Checking ECR repository..."
      - |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"


  build:
    commands:

      - echo "===== BUILD PHASE ====="

      - echo "Running ESLint..."
      - npx eslint src

      - echo "Running Jest tests..."
      - |
          CI=true \
          npx react-scripts test \
            --watchAll=false \
            --coverage \
            --runInBand

      - echo "Running SonarQube..."
      - |
          ./node_modules/.bin/sonar-scanner \
            -Dsonar.projectKey=Tetris \
            -Dsonar.projectName="Tetris Frontend" \
            -Dsonar.projectVersion="$IMAGE_TAG" \
            -Dsonar.sources=src \
            -Dsonar.tests=src \
            -Dsonar.test.inclusions="**/*.test.js,**/*.test.jsx" \
            -Dsonar.exclusions="node_modules/**,build/**,coverage/**" \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - echo "SonarQube Quality Gate passed."

      - echo "Building Docker image..."
      - |
          ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          docker build \
            --platform linux/amd64 \
            -t "$ECR_URI:$IMAGE_TAG" \
            .

      - echo "Docker build completed."


  post_build:
    commands:

      - echo "===== POST-BUILD PHASE ====="

      # ------------------------------------------------
      # 1. PUSH IMAGE TO ECR
      # ------------------------------------------------

      - echo "Pushing $IMAGE_TAG to ECR..."
      - |
          ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          docker push "$ECR_URI:$IMAGE_TAG"

      - echo "Image pushed successfully."


      # ------------------------------------------------
      # 2. WAIT FOR ECR SCAN
      # ------------------------------------------------

      - echo "===== WAITING FOR ECR SCAN ====="

      - mkdir -p reports

      - |
          SCAN_READY="false"

          for i in $(seq 1 30); do

            echo "ECR scan check $i/30"

            if aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageTag="$IMAGE_TAG" \
              --region "$AWS_REGION" \
              --output json \
              > reports/ecr-findings.json \
              2> /tmp/ecr-error.log
            then

              echo "ECR scan findings are available."

              SCAN_READY="true"

              break
            fi

            echo "ECR scan not ready yet."

            cat /tmp/ecr-error.log || true

            if grep -q "AccessDeniedException" /tmp/ecr-error.log; then
              echo "ERROR: Missing ecr:DescribeImageScanFindings permission."
              exit 1
            fi

            sleep 10

          done

          if [ "$SCAN_READY" != "true" ]; then
            echo "ERROR: ECR scan timeout."
            exit 1
          fi


      # ------------------------------------------------
      # 3. ECR OVERVIEW
      # ------------------------------------------------

      - echo "===== ECR VULNERABILITY OVERVIEW ====="

      - |
          CRITICAL=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
            --output text)

          HIGH=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageScanFindings.findingSeverityCounts.HIGH' \
            --output text)

          MEDIUM=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageScanFindings.findingSeverityCounts.MEDIUM' \
            --output text)

          LOW=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageScanFindings.findingSeverityCounts.LOW' \
            --output text)

          [ "$CRITICAL" = "None" ] && CRITICAL=0
          [ "$HIGH" = "None" ] && HIGH=0
          [ "$MEDIUM" = "None" ] && MEDIUM=0
          [ "$LOW" = "None" ] && LOW=0

          echo ""
          echo "=========================================="
          echo "ECR SCAN SUMMARY"
          echo "=========================================="
          echo "CRITICAL : $CRITICAL"
          echo "HIGH     : $HIGH"
          echo "MEDIUM   : $MEDIUM"
          echo "LOW      : $LOW"
          echo "=========================================="

          cat > reports/ecr-summary.txt <<EOF
          ECR Vulnerability Scan
          ======================
          Image: $ECR_REPOSITORY:$IMAGE_TAG

          CRITICAL: $CRITICAL
          HIGH: $HIGH
          MEDIUM: $MEDIUM
          LOW: $LOW
          EOF


      # ------------------------------------------------
      # 4. TRIVY DETAILED SCAN
      # ------------------------------------------------

      - echo "===== TRIVY DETAILED SCAN ====="

      - |
          ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          echo "Scanning:"
          echo "$ECR_URI:$IMAGE_TAG"

          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format table \
            --output reports/trivy-report.txt \
            "$ECR_URI:$IMAGE_TAG"

          cat reports/trivy-report.txt

      - echo "Generating Trivy JSON report..."

      - |
          ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format json \
            --output reports/trivy-report.json \
            "$ECR_URI:$IMAGE_TAG"


      # ------------------------------------------------
      # 5. TRIVY SECURITY GATE
      # ------------------------------------------------

      - echo "===== TRIVY SECURITY GATE ====="

      - |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' reports/trivy-report.json)

          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' reports/trivy-report.json)

          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' reports/trivy-report.json)

          LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' reports/trivy-report.json)

          echo ""
          echo "=========================================="
          echo "TRIVY SCAN SUMMARY"
          echo "=========================================="
          echo "CRITICAL : $CRITICAL"
          echo "HIGH     : $HIGH"
          echo "MEDIUM   : $MEDIUM"
          echo "LOW      : $LOW"
          echo "=========================================="

          cat > reports/trivy-summary.txt <<EOF
          Trivy Container Scan
          ====================

          Image: $ECR_REPOSITORY:$IMAGE_TAG

          CRITICAL: $CRITICAL
          HIGH: $HIGH
          MEDIUM: $MEDIUM
          LOW: $LOW
          EOF

          if [ "$CRITICAL" -gt 0 ]; then

            echo "=========================================="
            echo "SECURITY GATE FAILED"
            echo "=========================================="

            echo "CRITICAL vulnerabilities: $CRITICAL"

            aws sns publish \
              --topic-arn "$SNS_TOPIC_ARN" \
              --region "$AWS_REGION" \
              --subject "Tetris - SECURITY GATE FAILED" \
              --message "Tetris $IMAGE_TAG failed security gate. Trivy CRITICAL=$CRITICAL HIGH=$HIGH MEDIUM=$MEDIUM LOW=$LOW" \
              || true

            exit 1
          fi

          echo "=========================================="
          echo "SECURITY GATE PASSED"
          echo "=========================================="

          echo "CRITICAL: $CRITICAL - PASS"
          echo "HIGH: $HIGH - WARNING ONLY"
          echo "MEDIUM: $MEDIUM - WARNING ONLY"
          echo "LOW: $LOW - WARNING ONLY"


      # ------------------------------------------------
      # 6. GET IMAGE DIGEST
      # ------------------------------------------------

      - echo "Getting ECR image digest..."

      - |
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "Image:"
          echo "$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Digest:"
          echo "$IMAGE_DIGEST"


      # ------------------------------------------------
      # 7. PROMOTE TO DEV
      # ------------------------------------------------

      - echo "===== PROMOTING IMAGE TO DEV ====="

      - |
          ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          docker tag \
            "$ECR_URI:$IMAGE_TAG" \
            "$ECR_URI:dev"

          docker push \
            "$ECR_URI:dev"

      - echo "DEV promotion completed."


      # ------------------------------------------------
      # 8. SUCCESS SNS
      # ------------------------------------------------

      - echo "Sending SNS success notification..."

      - |
          aws sns publish \
            --topic-arn "$SNS_TOPIC_ARN" \
            --region "$AWS_REGION" \
            --subject "Tetris CI/CD - BUILD SUCCESS" \
            --message "Tetris $IMAGE_TAG build succeeded. SonarQube passed. ECR scan completed. Trivy scan completed. CRITICAL=0. Image promoted to dev." \
            || true

      - echo "===== PIPELINE COMPLETED SUCCESSFULLY ====="


artifacts:
  files:
    - "reports/**/*"
    - "coverage/**/*"

  base-directory: "03-Application/Tetris-V1"

  discard-paths: no


cache:
  paths:
    - "03-Application/Tetris-V1/node_modules/**/*"
    - "/root/.npm/**/*"
