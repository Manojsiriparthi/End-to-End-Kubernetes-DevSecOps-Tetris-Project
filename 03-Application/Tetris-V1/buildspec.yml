version: 0.2

env:
  variables:
    AWS_REGION: "ap-south-1"
    AWS_ACCOUNT_ID: "153099270680"
    ECR_REPOSITORY: "tetris/frontend"
    IMAGE_TAG: "v1.1.0"
    SONAR_HOST_URL: "http://13.232.24.76:9000"
    SNS_TOPIC_ARN: "arn:aws:sns:ap-south-1:153099270680:tetris-build-notifications"

  secrets-manager:
    SONAR_TOKEN: "sonarqube_token:Sonar_token"


phases:

  install:
    runtime-versions:
      nodejs: 18

    commands:

      - echo "=========================================="
      - echo "INSTALL PHASE"
      - echo "=========================================="

      - cd "$CODEBUILD_SRC_DIR/03-Application/Tetris-V1"

      - echo "Working directory:"
      - pwd

      - echo "Application files:"
      - ls -la

      - echo "Checking required files..."

      - |
          test -f package.json || {
            echo "ERROR: package.json not found"
            exit 1
          }

          test -f package-lock.json || {
            echo "ERROR: package-lock.json not found"
            exit 1
          }

          test -f Dockerfile || {
            echo "ERROR: Dockerfile not found"
            exit 1
          }

      - echo "Node version:"
      - node --version

      - echo "NPM version:"
      - npm --version

      - echo "Docker version:"
      - docker --version

      - echo "AWS CLI version:"
      - aws --version

      - echo "Installing Node dependencies..."
      - npm ci

      - echo "Installing SonarScanner..."
      - npm install --no-save sonar-scanner

      - echo "Checking SonarScanner..."
      - ./node_modules/.bin/sonar-scanner --version


  pre_build:
    commands:

      - echo "=========================================="
      - echo "PRE-BUILD PHASE"
      - echo "=========================================="

      - cd "$CODEBUILD_SRC_DIR/03-Application/Tetris-V1"

      - echo "Working directory:"
      - pwd

      - echo "Checking AWS identity..."
      - aws sts get-caller-identity

      - echo "Logging into Amazon ECR..."

      - |
          aws ecr get-login-password \
            --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin \
              "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - echo "ECR login successful."

      - echo "Checking ECR repository..."

      - |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      - echo "Creating reports directory..."
      - mkdir -p reports


  build:
    commands:

      - echo "=========================================="
      - echo "BUILD PHASE"
      - echo "=========================================="

      - cd "$CODEBUILD_SRC_DIR/03-Application/Tetris-V1"

      - echo "Working directory:"
      - pwd


      # ==========================================
      # ESLINT
      # ==========================================

      - echo "=========================================="
      - echo "RUNNING ESLINT"
      - echo "=========================================="

      - |
          npx eslint src

      - echo "ESLint passed."


      # ==========================================
      # JEST
      # ==========================================

      - echo "=========================================="
      - echo "RUNNING JEST TESTS"
      - echo "=========================================="

      - |
          CI=true npx react-scripts test \
            --watchAll=false \
            --coverage \
            --runInBand

      - echo "Jest tests passed."


      # ==========================================
      # SONARQUBE
      # ==========================================

      - echo "=========================================="
      - echo "RUNNING SONARQUBE"
      - echo "=========================================="

      - |
          ./node_modules/.bin/sonar-scanner \
            -Dsonar.projectKey=Tetris \
            -Dsonar.projectName="Tetris Frontend" \
            -Dsonar.projectVersion="$IMAGE_TAG" \
            -Dsonar.sources=src \
            -Dsonar.tests=src \
            -Dsonar.test.inclusions="**/*.test.js,**/*.test.jsx" \
            -Dsonar.exclusions="node_modules/**,build/**,coverage/**" \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - echo "SonarQube Quality Gate passed."


      # ==========================================
      # DOCKER BUILD
      # ==========================================

      - echo "=========================================="
      - echo "BUILDING DOCKER IMAGE"
      - echo "=========================================="

      - |
          ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          docker build \
            --platform linux/amd64 \
            -t "$ECR_URI:$IMAGE_TAG" \
            .

      - echo "Docker image built successfully."

      - docker images


      # ==========================================
      # TRIVY
      # ==========================================

      - echo "=========================================="
      - echo "PULLING TRIVY"
      - echo "=========================================="

      - |
          docker pull aquasec/trivy:0.56.2


      # ==========================================
      # TRIVY DETAILED REPORT
      # ==========================================

      - echo "=========================================="
      - echo "TRIVY DETAILED CONTAINER SCAN"
      - echo "=========================================="

      - |
          ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$CODEBUILD_SRC_DIR/03-Application/Tetris-V1/reports:/reports" \
            aquasec/trivy:0.56.2 \
            image \
            --scanners vuln \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format table \
            --output /reports/trivy-report.txt \
            "$ECR_URI:$IMAGE_TAG"

      - echo "Trivy detailed report:"
      - cat reports/trivy-report.txt


      # ==========================================
      # TRIVY JSON
      # ==========================================

      - echo "Generating Trivy JSON report..."

      - |
          ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$CODEBUILD_SRC_DIR/03-Application/Tetris-V1/reports:/reports" \
            aquasec/trivy:0.56.2 \
            image \
            --scanners vuln \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format json \
            --output /reports/trivy-report.json \
            "$ECR_URI:$IMAGE_TAG"


      # ==========================================
      # TRIVY SECURITY GATE
      # ==========================================

      - echo "=========================================="
      - echo "TRIVY SECURITY GATE"
      - echo "=========================================="

      - |
          ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          echo "Policy:"
          echo "CRITICAL = FAIL"
          echo "HIGH     = WARNING"
          echo "MEDIUM   = WARNING"
          echo "LOW      = WARNING"

          echo ""
          echo "Scanning for CRITICAL vulnerabilities..."

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2 \
            image \
            --scanners vuln \
            --severity CRITICAL \
            --exit-code 1 \
            "$ECR_URI:$IMAGE_TAG"

      - echo "=========================================="
      - echo "TRIVY SECURITY GATE PASSED"
      - echo "CRITICAL vulnerabilities = 0"
      - echo "=========================================="


  post_build:
    commands:

      - echo "=========================================="
      - echo "POST-BUILD PHASE"
      - echo "=========================================="

      - cd "$CODEBUILD_SRC_DIR/03-Application/Tetris-V1"

      - echo "Working directory:"
      - pwd


      # ==========================================
      # PUSH RELEASE IMAGE TO ECR
      # ==========================================

      - echo "=========================================="
      - echo "PUSHING IMAGE TO ECR"
      - echo "=========================================="

      - |
          ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          docker push "$ECR_URI:$IMAGE_TAG"

      - echo "Image pushed successfully."


      # ==========================================
      # WAIT FOR ECR SCAN
      # ==========================================

      - echo "=========================================="
      - echo "WAITING FOR ECR VULNERABILITY SCAN"
      - echo "=========================================="

      - |
          SCAN_READY="false"

          for i in $(seq 1 30); do

            echo "ECR scan check $i/30..."

            if aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageTag="$IMAGE_TAG" \
              --region "$AWS_REGION" \
              --output json \
              > reports/ecr-findings.json \
              2> /tmp/ecr-scan-error.log
            then

              echo "ECR scan findings are available."

              SCAN_READY="true"

              break

            fi

            echo "ECR scan is not ready yet."

            cat /tmp/ecr-scan-error.log || true

            if grep -q "AccessDeniedException" /tmp/ecr-scan-error.log; then

              echo "ERROR: Missing ecr:DescribeImageScanFindings permission."

              exit 1

            fi

            sleep 10

          done

          if [ "$SCAN_READY" != "true" ]; then

            echo "ERROR: ECR scan did not complete within timeout."

            exit 1

          fi


      # ==========================================
      # ECR OVERVIEW
      # ==========================================

      - echo "=========================================="
      - echo "ECR VULNERABILITY OVERVIEW"
      - echo "=========================================="

      - |
          CRITICAL=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
            --output text)

          HIGH=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageScanFindings.findingSeverityCounts.HIGH' \
            --output text)

          MEDIUM=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageScanFindings.findingSeverityCounts.MEDIUM' \
            --output text)

          LOW=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageScanFindings.findingSeverityCounts.LOW' \
            --output text)

          [ "$CRITICAL" = "None" ] && CRITICAL=0
          [ "$HIGH" = "None" ] && HIGH=0
          [ "$MEDIUM" = "None" ] && MEDIUM=0
          [ "$LOW" = "None" ] && LOW=0

          echo ""
          echo "=========================================="
          echo "ECR SCAN RESULTS"
          echo "=========================================="
          echo "CRITICAL : $CRITICAL"
          echo "HIGH     : $HIGH"
          echo "MEDIUM   : $MEDIUM"
          echo "LOW      : $LOW"
          echo "=========================================="


      # ==========================================
      # ECR REPORT
      # ==========================================

      - |
          cat > reports/ecr-summary.txt <<EOF
          ECR Vulnerability Scan
          ======================

          Image: $ECR_REPOSITORY:$IMAGE_TAG

          CRITICAL: $CRITICAL
          HIGH: $HIGH
          MEDIUM: $MEDIUM
          LOW: $LOW
          EOF


      # ==========================================
      # ECR CRITICAL GATE
      # ==========================================

      - echo "Checking ECR CRITICAL vulnerabilities..."

      - |
          if [ "$CRITICAL" -gt 0 ]; then

            echo "=========================================="
            echo "ECR SECURITY GATE FAILED"
            echo "=========================================="

            echo "CRITICAL vulnerabilities found: $CRITICAL"

            aws sns publish \
              --topic-arn "$SNS_TOPIC_ARN" \
              --region "$AWS_REGION" \
              --subject "Tetris - ECR SECURITY GATE FAILED" \
              --message "Tetris $IMAGE_TAG failed ECR security gate. CRITICAL=$CRITICAL HIGH=$HIGH MEDIUM=$MEDIUM LOW=$LOW" \
              || true

            exit 1

          fi

          echo "ECR security gate passed."
          echo "CRITICAL = 0"


      # ==========================================
      # PROMOTE TO DEV
      # ==========================================

      - echo "=========================================="
      - echo "PROMOTING IMAGE TO DEV"
      - echo "=========================================="

      - |
          ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          docker tag \
            "$ECR_URI:$IMAGE_TAG" \
            "$ECR_URI:dev"

          docker push \
            "$ECR_URI:dev"

      - echo "DEV promotion completed."


      # ==========================================
      # IMAGE DIGEST
      # ==========================================

      - echo "Getting image digest..."

      - |
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "=========================================="
          echo "IMAGE INFORMATION"
          echo "=========================================="
          echo "Repository : $ECR_REPOSITORY"
          echo "Release    : $IMAGE_TAG"
          echo "Environment: dev"
          echo "Digest     : $IMAGE_DIGEST"
          echo "=========================================="


      # ==========================================
      # SNS SUCCESS
      # ==========================================

      - echo "Sending SNS success notification..."

      - |
          aws sns publish \
            --topic-arn "$SNS_TOPIC_ARN" \
            --region "$AWS_REGION" \
            --subject "Tetris CI/CD - BUILD SUCCESS" \
            --message "Tetris $IMAGE_TAG passed Jest, SonarQube, Trivy and ECR security checks. CRITICAL=0. Image promoted to dev." \
            || true

      - echo "=========================================="
      - echo "PIPELINE COMPLETED SUCCESSFULLY"
      - echo "=========================================="


artifacts:
  files:
    - "reports/**/*"
    - "coverage/**/*"

  base-directory: "03-Application/Tetris-V1"

  discard-paths: no


cache:
  paths:
    - "03-Application/Tetris-V1/node_modules/**/*"
    - "/root/.npm/**/*"
